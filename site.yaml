    activa: true
    antetitulo: Ven a vernos
    titulo: Horario y dónde estamos
    texto: "En plena calle Mayor, bajando de la catedral hacia la plaza. Aparcamiento en la Alameda, a cinco minutos a pie."
    imagen: /fotos/fachada.jpg
    horario:
      - { dia: Lunes y martes, horas: Cerrado }
