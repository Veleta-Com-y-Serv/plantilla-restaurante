  sobre:
    activa: true
    antetitulo: La casa
    titulo: Tres generaciones en la calle Mayor
    declaracion: "Aquí se cocina como en casa: sin prisa y con lo que da la sierra."
    texto: |
      Leandra abrió la casa de comidas en 1968, en los bajos de una casona de piedra. Hoy la llevan su nieta Marta, en la cocina, y Javier, en la sala.

      El horno de leña es el mismo de entonces. Los asados salen de él cada día, y los guisos se hacen la víspera para que reposen.

      Compramos a ganaderos y huertas de la comarca, y la bodega es casi toda de Guadalajara y de la Ribera del Duero.
    imagen: /fotos/sobre.jpg
    items:
      - { titulo: Producto cercano, texto: "Carne, verdura y queso de la comarca de Sigüenza." }
      - { titulo: Sin prisa, texto: "Guisos de la víspera y asados lentos en horno de leña." }
      - { titulo: Trato de casa, texto: "Una sala pequeña, de doce mesas, donde te atendemos nosotros." }

